name: testit

on:
  push:
  pull_request:

jobs:
  testit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Asennus
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Testit
        run: pytest
