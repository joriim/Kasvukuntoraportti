[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kasvukuntoraportti"
dynamic = ["version"]
description = "Peltolohkon kasvukuntoraportti yhtenä HTML-kirjasena (Signaali-ilme, Helle yöllä -kansi)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/kasvukuntoraportti/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kasvukuntoraportti"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/kasvukuntoraportti/raportti.py" = ["E501"]
"src/kasvukuntoraportti/ilme.py" = ["E501"]
"src/kasvukuntoraportti/kirja.py" = ["E501"]
